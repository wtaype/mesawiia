org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
android.disallowKotlinSourceSets=false

# === Optimización de Compilación Gradle ===
# Compilar módulos en paralelo si no se dependen entre sí
org.gradle.parallel=true
# Reutilizar salidas de tareas que no cambiaron (caché de build)
org.gradle.caching=true
# Guardar el modelo del proyecto entre builds (experimental pero estable en AGP 9.x)
org.gradle.configuration-cache=true
# No procesar librerías legadas de Support Library (ya usamos AndroidX 100%)
android.enableJetifier=false
